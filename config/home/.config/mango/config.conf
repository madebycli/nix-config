

# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
#blur_params_brightness=0.9
#blur_params_contrast=0.9
#blur_params_saturation=1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1
unfocused_opacity=1

# Animation Configuration(support type:zoom,slide)
animations=1
layer_animations=0

# Animation on close and open window
# slide, zoom, fade
animation_type_open=zoom
animation_type_close=zoom

animation_fade_in=1
animation_fade_out=1

# 1-horizontal,0-vertical
tag_animation_direction=0

# zoom type animation
zoom_initial_ratio=0.5
zoom_end_ratio=0.8

# fade type animation
fadein_begin_opacity=0.9
fadeout_begin_opacity=0.8

# Animation Duration
animation_duration_move=500
animation_duration_open=300
animation_duration_tag=400
animation_duration_close=200
animation_duration_focus=0

# Animation curve (cubic bezier)
animation_curve_open=0.4,0.9,0.6,1
animation_curve_close=0.08,0.82,0.17,1
animation_curve_move=0.46,1.0,0.29,1

animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

animation_curve_tag=0.25, 1.25, 0.5, 1

animation_curve_focus=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=10
scroller_default_proportion = 0.50
scroller_default_proportion_single = 1.00
scroller_ignore_proportion_single = 0
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
scroller_proportion_preset=0.5,0.7,1.0

# Center Tile
center_master_overspread = 0
center_when_single_stack = 1

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.5
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=0
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30
ov_no_resize=1


# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=22
cursor_theme=Bibata-Modern-Classic
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=de

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=6
gappiv=6
gappoh=6
gappov=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

#tagrule=id:1,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:2,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:3,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:4,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:5,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:6,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:7,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:8,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller
#tagrule=id:9,monitor_name:^HDMI-A-1$,layout_name:vertical_scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
############################################################################################################

############################################################################################################

bind=SUPER,r,reload_config
bind=SUPER,Return,spawn,ghostty
bind=SUPER,Space,spawn,fuzzel
bind=SUPER,e,spawn,nautilus
bind=SUPER,b,spawn,brave
bind=SUPER,w,spawn,librewolf
bind=SUPER,v,spawn,vesktop
#bind=SUPER,s,spawn,noctalia ipc call sessionMenu toggle
#bind=SUPER,l,spawn,noctalia ipc call lockScreen lock
#bind=SUPER,p,spawn,noctalia ipc call sessionMenu lockAndSuspend
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=SUPER,s,spawn,nix-settings sound

# exit
bind=SUPER+SHIFT,m,quit
bind=SUPER,q,killclient,
bind=SUPER+ALT,q,killclient,force


bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
#bind=SUPER+ALT,Down,focusdir,down
#bind=SUPER+ALT,Up,focusdir,up

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=ALT,Tab,toggleoverview,
bind=SUPER,p,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad
bind=SUPER,g,toggleglobal,

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,UP,viewtoleft,0
bind=CTRL,UP,viewtoleft_have_client,0
bind=SUPER,DOWN,viewtoright,0t
bind=CTRL,DOWN,viewtoright_have_client,0
bind=SUPER+SHIFT,UP,tagtoleft,0
bind=SUPER+SHIFT,DOWN,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL+shift,Left,tagmon,left
bind=SUPER+CTRL+shift,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

############################################################################################################
# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


monitorrule=make:LG Electronics,model:LG ULTRAGEAR,width:2560,height:1440,refresh:143.973007,scale:1,vrr:1,x:1920,y:0
monitorrule=make:Lenovo Group Limited,width:1920,height:1380,refresh:80,scale:1,x:0,y:60
#,rr:1
#allow_tearing=2

exec-once=noctalia
#exec-once=vicinae server
#exec-once=arch-update --tray
#exec=vicinae server
#exec-once=pkill -x noctalia; exec env -u XDG_SESSION_ID noctalia
#exec-once=pkill -f lxqt-policykit-agent; exec env -u XDG_SESSION_ID lxqt-policykit-agent

#bind=SUPER,Space,spawn,fuzzel
#bind=SUPER,e,spawn,nautilus
#bind=SUPER,s,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
#bind=SUPER,d,spawn,qs -c noctalia-shell ipc call plugin:wallcards toggle
#bind=SUPER,l,spawn,qs -c noctalia-shell ipc call lockScreen lock
#bind=SUPER,p,spawn,qs -c noctalia-shell ipc call sessionMenu lockAndSuspend


#bind=SUPER,a,spawn,app.twintaillauncher.ttl
#bind=SUPER+SHIFT,ü,spawn,noctalia msg screenshot-region

bind=SUPER+SHIFT,g,spawn,gif-picker
bind=SUPER+SHIFT,h,spawn,gif-player edit
bind=SUPER+SHIFT,k,spawn,gif-player stop-all
bind=SUPER+SHIFT,j,spawn,gif-control

# Media keys
bind=NONE,XF86MonBrightnessUp,spawn,qs -c noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,qs -c noctalia-shell ipc call brightness decrease


bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle


env=QT_QPA_PLATFORMTHEME,gtk3
env=QT5_QPA_PLATFORMTHEME,gtk3
#env=XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:$HOME/.local/share:/usr/local/share:/usr/share
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,22

windowrule=focused_opacity:0.92,appid:ghostty
windowrule=unfocused_opacity:0.92,appid:ghostty

windowrule=focused_opacity:0.95,appid:org.gnome.Nautilus
windowrule=unfocused_opacity:0.95,appid:org.gnome.Nautilus

windowrule=focused_opacity:0.95,appid:xed
windowrule=unfocused_opacity:0.95,appid:xed

windowrule=focused_opacity:0.8,appid:dev.zed.Zed
windowrule=unfocused_opacity:0.8,appid:dev.zed.Zed

windowrule=isopensilent:1,isfullscreen:1,tags:4,appid:steam_proton
windowrule=isopensilent:1,isfullscreen:1,tags:4,appid:steam_app_.
windowrule=isopensilent:1,isfullscreen:1,tags:4,appid:steam_app_default
windowrule=isopensilent:1,isfullscreen:1,tags:4,appid:broken

windowrule=isoverlay:1,title:Bild im Bild

windowrule=isfloating:1,isoverlay:1,offsety:11,offsetx:-100,appid:org.gnome.Calculator
windowrule=isfakefullscreen:1,ignore_maximize:0,ignore_minimize:0,allow_csd:1,appid:twintaillauncher
windowrule=isfullscreen:1,appid:mcpelauncher-client
#windowrule=isfakefullscreen:1,title:Sleepy Launcher
#windowrule=isfakefullscreen:1,title:The Honkers Railway Launcher
windowrule=isfloating:1,appid:org.gnome.NautilusPreviewer

#bind=SUPER+SHIFT,L,spawn,pkexec --disable-internal-agent true

#windowrule=scroller_proportion:1.0,appid:steam
