<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NixOS multi-host configuration</title>
  <desc id="desc">A clean blue Nix-style snowflake beside the title NixOS Multi-Host Configuration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b33"/>
      <stop offset="1" stop-color="#111b38"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe8ff"/>
      <stop offset="0.45" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#7d6cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8fb8ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="220" cy="180" r="126" fill="#5aa7ff" opacity="0.07"/>
  <circle cx="220" cy="180" r="91" fill="none" stroke="#8fe8ff" stroke-opacity="0.14" stroke-width="1.5"/>

  <g transform="translate(220 180)" fill="none" stroke="url(#ice)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0-104V104"/>
    <path d="M-90-52L90 52"/>
    <path d="M90-52L-90 52"/>
    <path d="M0-104L-22-70M0-104L22-70"/>
    <path d="M0 104L-22 70M0 104L22 70"/>
    <path d="M-90-52L-49-49M-90-52L-69-16"/>
    <path d="M90 52L49 49M90 52L69 16"/>
    <path d="M90-52L49-49M90-52L69-16"/>
    <path d="M-90 52L-49 49M-90 52L-69 16"/>
  </g>
  <circle cx="220" cy="180" r="20" fill="#081426" stroke="#9cecff" stroke-width="7"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="405" y="139" fill="#f4f8ff" font-size="58" font-weight="760" letter-spacing="-1.5">NixOS Multi-Host</text>
    <text x="405" y="201" fill="url(#ice)" font-size="58" font-weight="760" letter-spacing="-1.5">Configuration</text>
    <text x="409" y="247" fill="#b9c8df" font-size="22" font-weight="500">reproducible systems · safe updates · shared desktops</text>
  </g>

  <g fill="#98b7e6" opacity="0.55">
    <circle cx="1060" cy="73" r="3"/><circle cx="1112" cy="124" r="2"/><circle cx="1015" cy="282" r="2.5"/>
    <circle cx="965" cy="78" r="1.8"/><circle cx="1135" cy="274" r="2"/>
  </g>
  <path d="M925 291C1008 268 1072 223 1132 152" fill="none" stroke="#6ea8ff" stroke-opacity="0.13" stroke-width="2"/>
</svg>
