name: Apply live feedback fixes

on:
  push:
    branches: [feat/github-cli-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync
          fetch-depth: 0
      - name: Apply guarded fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/config-sync-wrapper.sh",
              'exec python3 "$SYNC_BACKEND" "${ARGS[@]}"\n',
              'export NIX_CONFIG_GITHUB_AUTH_BACKEND="$AUTH_BACKEND"\nexec python3 "$SYNC_BACKEND" "${ARGS[@]}"\n',
          )

          replace_once(
              "scripts/config-sync.py",
              "import hashlib\nimport json\n",
              "import hashlib\nimport importlib.util\nimport json\n",
          )
          replace_once(
              "scripts/config-sync.py",
              "from pathlib import Path\nfrom typing import Iterable, Mapping, Sequence\n",
              "from pathlib import Path\nfrom types import ModuleType\nfrom typing import Iterable, Mapping, Sequence\n",
          )

          marker = '''def changed_repo_paths(repo: Path) -> list[str]:\n'''
          addition = '''def load_github_auth_backend() -> ModuleType | None:\n    candidates: list[Path] = []\n    explicit = os.environ.get("NIX_CONFIG_GITHUB_AUTH_BACKEND")\n    if explicit:\n        candidates.append(Path(explicit))\n    candidates.append(Path(__file__).with_name("github-cli-auth.py"))\n    for path in candidates:\n        if not path.is_file():\n            continue\n        spec = importlib.util.spec_from_file_location("nix_config_sync_github_auth", path)\n        if spec is None or spec.loader is None:\n            continue\n        module = importlib.util.module_from_spec(spec)\n        sys.modules[spec.name] = module\n        spec.loader.exec_module(module)\n        return module\n    return None\n\n\ndef github_status_payload(repo: Path) -> dict[str, object]:\n    backend = load_github_auth_backend()\n    if backend is None:\n        return {\n            "ghInstalled": shutil.which("gh") is not None,\n            "authenticated": False,\n            "login": None,\n            "permission": None,\n            "canPush": False,\n            "remoteUrl": git(repo, "remote", "get-url", "origin", check=False) or None,\n            "remoteOk": False,\n            "gitName": git(repo, "config", "user.name", check=False) or None,\n            "gitEmail": git(repo, "config", "user.email", check=False) or None,\n            "credentialHelperReady": False,\n            "error": "GitHub authentication backend is unavailable",\n        }\n    value = backend.status(repo)\n    return {\n        "ghInstalled": bool(value.gh_installed),\n        "authenticated": bool(value.authenticated),\n        "login": value.login,\n        "permission": value.permission,\n        "canPush": bool(value.can_push),\n        "remoteUrl": value.remote_url,\n        "remoteOk": bool(value.remote_ok),\n        "gitName": value.git_name,\n        "gitEmail": value.git_email,\n        "credentialHelperReady": bool(value.credential_helper_ready),\n        "error": value.error,\n    }\n\n\ndef status_payload(args: argparse.Namespace) -> dict[str, object]:\n    repo = find_repo(args.repo)\n    ensure_remote(repo)\n    fetch(repo, args.offline)\n    ahead, behind, target = relation(repo)\n    branch = git(repo, "branch", "--show-current")\n    state = load_state(repo)\n    local_changes = worktree_lines(repo)\n    staged_output = git(repo, "diff", "--cached", "--name-only")\n    staged_changes = staged_output.splitlines() if staged_output else []\n\n    changes: dict[str, list[str]] = {"local": [], "remote": [], "same": [], "conflicts": []}\n    if args.scope != "nixos":\n        active, mirror, baseline = manifests(repo)\n        classified = classify(active, mirror, baseline)\n        changes = {\n            "local": list(classified.local),\n            "remote": list(classified.remote),\n            "same": list(classified.same),\n            "conflicts": list(classified.conflicts),\n        }\n\n    backups = state_dir(repo) / "backups"\n    backup_entries: list[str] = []\n    if backups.is_dir():\n        backup_entries = sorted(\n            (str(path) for path in backups.iterdir() if path.is_dir()), reverse=True\n        )[:20]\n\n    planned_action = "none"\n    if changes["conflicts"] or (ahead and behind):\n        planned_action = "manual-resolution-required"\n    elif behind and (changes["local"] or local_changes):\n        planned_action = "safe-sync"\n    elif behind:\n        planned_action = "download"\n    elif ahead or changes["local"] or local_changes:\n        planned_action = "upload"\n\n    return {\n        "schemaVersion": 1,\n        "repositoryPath": str(repo),\n        "profile": profile_from_state(repo, None),\n        "host": socket.gethostname().split(".", 1)[0],\n        "scope": args.scope,\n        "branch": branch,\n        "upstream": target,\n        "ahead": ahead,\n        "behind": behind,\n        "dirty": bool(local_changes or staged_changes),\n        "lastSync": state.get("last_sync"),\n        "lastSyncedCommit": state.get("last_synced_commit"),\n        "localChanges": local_changes,\n        "stagedChanges": staged_changes,\n        "changes": changes,\n        "plannedAction": planned_action,\n        "backups": backup_entries,\n        "github": github_status_payload(repo),\n        "errors": [],\n    }\n\n\n'''
          replace_once("scripts/config-sync.py", marker, addition + marker)

          old_status = '''def command_status(args: argparse.Namespace) -> None:\n    repo = find_repo(args.repo)\n    ensure_remote(repo)\n    fetch(repo, args.offline)\n    print(f"Repository: {repo}")\n'''
          new_status = '''def command_status(args: argparse.Namespace) -> None:\n    if args.json:\n        print(json.dumps(status_payload(args), ensure_ascii=False, sort_keys=True))\n        return\n    repo = find_repo(args.repo)\n    ensure_remote(repo)\n    fetch(repo, args.offline)\n    print(f"Repository: {repo}")\n'''
          replace_once("scripts/config-sync.py", old_status, new_status)

          old_pull = '''    if staged(repo):\n        raise SyncError("Bereits vorgemerkte Änderungen gefunden. Pull abgebrochen.")\n    if worktree_lines(repo):\n        raise SyncError(\n            "Das Repository enthält lokale Änderungen. Für einen sicheren Pull "\n            "zuerst 'config-sync push' oder 'config-sync sync' verwenden."\n        )\n    _, pulled_paths = fast_forward(repo, args.offline)\n'''
          new_pull = '''    if staged(repo):\n        raise SyncError("Bereits vorgemerkte Änderungen gefunden. Pull abgebrochen.")\n    local_repo_paths = changed_repo_paths(repo)\n    if args.scope != "nixos":\n        mirror_prefix = MIRROR_PREFIX.as_posix()\n        local_mirror_paths = [\n            path\n            for path in local_repo_paths\n            if path == mirror_prefix or path.startswith(f"{mirror_prefix}/")\n        ]\n        if local_mirror_paths:\n            raise SyncError(\n                "Lokale Änderungen im Dotfile-Spiegel können nicht als Download behandelt werden. "\n                "Upload oder Synchronize verwenden:\\n  " + "\\n  ".join(local_mirror_paths)\n            )\n    _, pulled_paths = fast_forward(repo, args.offline)\n'''
          replace_once("scripts/config-sync.py", old_pull, new_pull)

          replace_once(
              "scripts/config-sync.py",
              '    main.add_argument("--offline", action="store_true", help="Keine Netzwerkoperation")\n',
              '    main.add_argument("--offline", action="store_true", help="Keine Netzwerkoperation")\n    main.add_argument("--json", action="store_true", help="Status als JSON ausgeben")\n',
          )
          replace_once(
              "scripts/config-sync.py",
              '    flag_options = {"--offline", "--yes", "-y"}\n',
              '    flag_options = {"--offline", "--json", "--yes", "-y"}\n',
          )

          test_path = Path("tests/test_github_cli_sync.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "import builtins\n",
              "import argparse\nimport builtins\n",
              1,
          )
          anchor = '''    def test_yes_mode_commits_without_prompt(self) -> None:\n'''
          if tests.count(anchor) != 1:
              raise SystemExit("test anchor missing")
          new_tests = '''    def test_command_pull_allows_disjoint_nixos_worktree_change(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            local, producer = self.make_remote_pair(root)\n            (local / "local-only.txt").write_text("keep me\\n", encoding="utf-8")\n            (producer / "remote-only.txt").write_text("download me\\n", encoding="utf-8")\n            command("git", "add", "remote-only.txt", cwd=producer)\n            command("git", "commit", "-m", "remote", cwd=producer)\n            command("git", "push", cwd=producer)\n            args = argparse.Namespace(\n                repo=str(local),\n                offline=False,\n                scope="nixos",\n                no_apply=True,\n                profile=None,\n                yes=True,\n            )\n            with mock.patch.object(self.sync, "ensure_remote"):\n                self.sync.command_pull(args)\n            self.assertEqual((local / "local-only.txt").read_text(), "keep me\\n")\n            self.assertEqual((local / "remote-only.txt").read_text(), "download me\\n")\n\n    def test_json_status_is_native_config_sync_contract(self) -> None:\n        args = self.sync.parser().parse_args(\n            self.sync.normalize_argv(["status", "--json", "--offline", "--scope", "nixos"])\n        )\n        self.assertTrue(args.json)\n        self.assertEqual(args.command, "status")\n        self.assertEqual(args.scope, "nixos")\n\n'''
          tests = tests.replace(anchor, new_tests + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Validate patched backend
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/config-sync-wrapper.sh
          python3 -m py_compile scripts/config-sync.py scripts/config-sync-json.py scripts/github-cli-auth.py
          python3 -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/config-sync.py scripts/config-sync-wrapper.sh tests/test_github_cli_sync.py
          git commit -m 'fix(sync): make packaged JSON status self-contained'
          git push origin HEAD:feat/github-cli-sync
