name: Apply guarded live conflict resolution fix

on:
  push:
    branches: [feat/github-cli-sync]
    paths:
      - .github/workflows/live-conflict-resolution-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync
          fetch-depth: 0
      - name: Apply guarded backend patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/config-sync.py')
          text = path.read_text(encoding='utf-8')

          if 'def resolve_dotfile_conflicts(' not in text:
              anchor = '\ndef upstream(repo: Path) -> str | None:\n'
              if anchor not in text:
                  raise SystemExit('resolve helper anchor missing')
              helper = '''\ndef resolve_dotfile_conflicts(\n    repo: Path,\n    changes: ChangeSet,\n    *,\n    policy: str | None,\n    assume_yes: bool,\n) -> None:\n    """Resolve only already-classified dotfile conflicts after an explicit choice."""\n    if not changes.conflicts:\n        return\n    if policy not in {"local", "repository"}:\n        raise SyncError(\n            "Dotconfig-Konflikte erkannt. Explizit lokale oder Repository-Version wählen."\n        )\n\n    print("\\nKonfliktauflösung:")\n    for relative in changes.conflicts:\n        print(f"  {relative}")\n\n    if policy == "local":\n        if not confirm(\n            "Lokale Versionen für diese Konflikte übernehmen?",\n            assume_yes,\n        ):\n            raise SyncError("Konfliktauflösung abgebrochen.")\n        copy_local_to_mirror(repo, changes.conflicts)\n        print("\\nLokale Versionen wurden für die ausgewählten Konflikte übernommen.")\n        return\n\n    backup_root = state_dir(repo) / "backups" / now_stamp()\n    apply_mirror_to_local(\n        repo,\n        changes.conflicts,\n        backup_root,\n        assume_yes=assume_yes,\n    )\n    print(f"\\nLokale Konflikt-Backups: {backup_root}")\n\n'''
              text = text.replace(anchor, helper + anchor, 1)

          old_push = '''        if changes.conflicts:\n            raise SyncError("Dotconfig-Konflikte erkannt. Keine Datei wurde überschrieben.")\n        if changes.remote:\n            raise SyncError("Repository-Dotconfigs sind neuer. Zuerst pull oder sync ausführen.")\n        copy_local_to_mirror(repo, changes.local)\n'''
          new_push = '''        if changes.remote:\n            raise SyncError("Repository-Dotconfigs sind neuer. Zuerst pull oder sync ausführen.")\n        if changes.conflicts:\n            policy = getattr(args, "conflict_policy", None)\n            if policy not in {None, "local"}:\n                raise SyncError("Upload kann Konflikte nur explizit mit lokalen Versionen auflösen.")\n            resolve_dotfile_conflicts(\n                repo,\n                changes,\n                policy=policy,\n                assume_yes=args.yes,\n            )\n            active, mirror, baseline = manifests(repo)\n            changes = classify(active, mirror, baseline)\n            if changes.conflicts:\n                raise SyncError("Konflikte blieben nach lokaler Auflösung bestehen.")\n        copy_local_to_mirror(repo, changes.local)\n'''
          if old_push in text:
              text = text.replace(old_push, new_push, 1)
          elif 'Upload kann Konflikte nur explizit mit lokalen Versionen auflösen.' not in text:
              raise SystemExit('push conflict block missing')

          old_pull = '''        if changes.conflicts:\n            raise SyncError("Lokale und entfernte Dotconfigs wurden gleichzeitig geändert.")\n        backup_root = state_dir(repo) / "backups" / now_stamp()\n        apply_mirror_to_local(repo, changes.remote, backup_root, assume_yes=args.yes)\n'''
          new_pull = '''        if changes.conflicts:\n            policy = getattr(args, "conflict_policy", None)\n            if policy not in {None, "repository"}:\n                raise SyncError("Download kann Konflikte nur explizit mit Repository-Versionen auflösen.")\n            resolve_dotfile_conflicts(\n                repo,\n                changes,\n                policy=policy,\n                assume_yes=args.yes,\n            )\n            active, mirror, baseline = manifests(repo)\n            changes = classify(active, mirror, baseline)\n            if changes.conflicts:\n                raise SyncError("Konflikte blieben nach Repository-Auflösung bestehen.")\n        backup_root = state_dir(repo) / "backups" / now_stamp()\n        apply_mirror_to_local(repo, changes.remote, backup_root, assume_yes=args.yes)\n'''
          if old_pull in text:
              text = text.replace(old_pull, new_pull, 1)
          elif 'Download kann Konflikte nur explizit mit Repository-Versionen auflösen.' not in text:
              raise SystemExit('pull conflict block missing')

          old_sync = '''        if changes.conflicts:\n            raise SyncError("Konflikte erkannt. Keine automatische Gewinnerwahl nach Datum.")\n\n        backup_root = state_dir(repo) / "backups" / now_stamp()\n        apply_mirror_to_local(repo, changes.remote, backup_root, assume_yes=args.yes)\n        copy_local_to_mirror(repo, changes.local)\n'''
          new_sync = '''        if changes.conflicts:\n            resolve_dotfile_conflicts(\n                repo,\n                changes,\n                policy=getattr(args, "conflict_policy", None),\n                assume_yes=args.yes,\n            )\n            active, mirror, baseline = manifests(repo)\n            changes = classify(active, mirror, baseline)\n            if changes.conflicts:\n                raise SyncError("Konflikte blieben nach expliziter Auflösung bestehen.")\n\n        backup_root = state_dir(repo) / "backups" / now_stamp()\n        apply_mirror_to_local(repo, changes.remote, backup_root, assume_yes=args.yes)\n        copy_local_to_mirror(repo, changes.local)\n'''
          if old_sync in text:
              text = text.replace(old_sync, new_sync, 1)
          elif 'Konflikte blieben nach expliziter Auflösung bestehen.' not in text:
              raise SystemExit('sync conflict block missing')

          push_parser = '''    push.add_argument("--message", "-m")\n    push.add_argument("--no-commit", action="store_true")\n'''
          push_repl = '''    push.add_argument("--message", "-m")\n    push.add_argument("--no-commit", action="store_true")\n    push.add_argument("--conflict-policy", choices=("local", "repository"))\n'''
          if '--conflict-policy' not in text:
              if push_parser not in text:
                  raise SystemExit('push parser block missing')
              text = text.replace(push_parser, push_repl, 1)
              pull_parser = '''    pull = commands.add_parser("pull", help="Fast-Forward-Pull und sichere Übernahme")\n    pull.add_argument("--no-apply", action="store_true", help="Kein NixOS-Build/Switch")\n'''
              pull_repl = '''    pull = commands.add_parser("pull", help="Fast-Forward-Pull und sichere Übernahme")\n    pull.add_argument("--no-apply", action="store_true", help="Kein NixOS-Build/Switch")\n    pull.add_argument("--conflict-policy", choices=("local", "repository"))\n'''
              if pull_parser not in text:
                  raise SystemExit('pull parser block missing')
              text = text.replace(pull_parser, pull_repl, 1)
              sync_parser = '''    sync.add_argument("--message", "-m")\n    sync.add_argument("--no-commit", action="store_true")\n    sync.add_argument("--no-apply", action="store_true")\n'''
              sync_repl = '''    sync.add_argument("--message", "-m")\n    sync.add_argument("--no-commit", action="store_true")\n    sync.add_argument("--no-apply", action="store_true")\n    sync.add_argument("--conflict-policy", choices=("local", "repository"))\n'''
              if sync_parser not in text:
                  raise SystemExit('sync parser block missing')
              text = text.replace(sync_parser, sync_repl, 1)

          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_github_cli_sync.py')
          t = tests.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if 'test_dotfiles_upload_conflict_can_explicitly_choose_local' not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker missing')
              addition = r'''
    def test_dotfiles_upload_conflict_can_explicitly_choose_local(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            repo = root / "repo"
            home = root / "home"
            command("git", "init", str(repo))
            configure_identity(repo)
            (repo / "sync").mkdir(parents=True)
            mirror_dir = repo / "config/home/.config/example"
            mirror_dir.mkdir(parents=True)
            active_dir = home / ".config/example"
            active_dir.mkdir(parents=True)
            (repo / "flake.nix").write_text("initial\n", encoding="utf-8")
            (repo / "sync/paths.conf").write_text(".config/example\n", encoding="utf-8")
            (repo / "sync/excludes.conf").write_text("**/*.tmp\n", encoding="utf-8")
            active_file = active_dir / "settings.conf"
            mirror_file = mirror_dir / "settings.conf"
            active_file.write_text("base\n", encoding="utf-8")
            mirror_file.write_text("base\n", encoding="utf-8")
            command("git", "add", ".", cwd=repo)
            command("git", "commit", "-m", "initial", cwd=repo)

            with mock.patch.dict(os.environ, {"HOME": str(home)}, clear=False):
                active, _mirror, _baseline = self.sync.manifests(repo)
                self.sync.save_state(repo, active, "test")
                active_file.write_text("local wins\n", encoding="utf-8")
                mirror_file.write_text("repository changed\n", encoding="utf-8")
                args = argparse.Namespace(
                    repo=str(repo),
                    offline=True,
                    scope="dotfiles",
                    message=None,
                    no_commit=False,
                    profile=None,
                    yes=True,
                    conflict_policy="local",
                )
                with mock.patch.object(self.sync, "ensure_remote"):
                    self.sync.command_push(args)
                active_after, mirror_after, baseline_after = self.sync.manifests(repo)

            self.assertEqual(mirror_file.read_text(encoding="utf-8"), "local wins\n")
            self.assertEqual(active_after, mirror_after)
            self.assertEqual(active_after, baseline_after)
            self.assertEqual(command("git", "status", "--porcelain", cwd=repo), "")

    def test_dotfiles_upload_conflict_without_choice_remains_blocked(self) -> None:
        changes = self.sync.ChangeSet((), (), (), (".config/example/settings.conf",))
        with self.assertRaises(self.sync.SyncError):
            self.sync.resolve_dotfile_conflicts(
                Path("/tmp/repo"),
                changes,
                policy=None,
                assume_yes=True,
            )
'''
              t = t.replace(marker, '\n' + addition + marker, 1)
              tests.write_text(t, encoding='utf-8')
          PY
          python3 -m py_compile scripts/config-sync.py
          python3 -m unittest discover -s tests -v
      - name: Commit backend patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/config-sync.py tests/test_github_cli_sync.py
          git diff --cached --check
          git commit -m 'fix(sync): add explicit dotfile conflict resolution'
          git push origin HEAD:feat/github-cli-sync
