name: Apply guarded live conflict resolution fix

on:
  push:
    branches:
      - feat/github-cli-sync
    paths:
      - .github/workflows/live-conflict-resolution-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync
          fetch-depth: 0
      - name: Apply guarded backend patch
        run: python3 .github/live_conflict_patch.py
      - name: Validate backend patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/config-sync.py
          python3 -m unittest discover -s tests -v
      - name: Commit backend patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/config-sync.py tests/test_github_cli_sync.py
          git diff --cached --check
          git commit -m 'fix(sync): add explicit dotfile conflict resolution'
          git push origin HEAD:feat/github-cli-sync
