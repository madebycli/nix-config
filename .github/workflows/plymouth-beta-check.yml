name: Plymouth beta check

on:
  push:
    branches:
      - feature/plymouth-boot-splash-beta
  workflow_dispatch:

concurrency:
  group: plymouth-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/plmf.sh tests/plmf-cli-test.sh
          fi

      - name: Run PLMF selector tests
        run: bash tests/plmf-cli-test.sh

      - name: Provide synthetic CI hardware configuration
        run: |
          cat > /tmp/hardware-configuration.nix <<'EOF'
          { modulesPath, ... }:

          {
            imports = [ (modulesPath + "/profiles/qemu-guest.nix") ];

            boot.initrd.availableKernelModules = [ "virtio_pci" "virtio_blk" "xhci_pci" ];

            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };

            fileSystems."/boot" = {
              device = "/dev/disk/by-label/ESP";
              fsType = "vfat";
            };

            swapDevices = [ ];
          }
          EOF
          cp /tmp/hardware-configuration.nix hosts/nyx/hardware-configuration.nix
          cp /tmp/hardware-configuration.nix hosts/aether/hardware-configuration.nix

      - name: Evaluate primary host boot closures
        run: |
          set -euo pipefail
          nix eval --accept-flake-config --no-write-lock-file --raw .#nixosConfigurations.nyx.config.system.build.toplevel.drvPath
          nix eval --accept-flake-config --no-write-lock-file --raw .#nixosConfigurations.aether.config.system.build.toplevel.drvPath

  host-initrd:
    strategy:
      fail-fast: false
      matrix:
        host: [nyx, aether]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide synthetic CI hardware configuration
        run: |
          cat > /tmp/hardware-configuration.nix <<'EOF'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/profiles/qemu-guest.nix") ];
            boot.initrd.availableKernelModules = [ "virtio_pci" "virtio_blk" "xhci_pci" ];
            fileSystems."/" = { device = "/dev/disk/by-label/nixos"; fsType = "ext4"; };
            fileSystems."/boot" = { device = "/dev/disk/by-label/ESP"; fsType = "vfat"; };
            swapDevices = [ ];
          }
          EOF
          cp /tmp/hardware-configuration.nix hosts/nyx/hardware-configuration.nix
          cp /tmp/hardware-configuration.nix hosts/aether/hardware-configuration.nix

      - name: Build ${{ matrix.host }} initrd
        run: |
          nix build \
            --accept-flake-config \
            --no-link \
            --no-write-lock-file \
            --print-build-logs \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.initialRamdisk

  vm-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: minimal-default
            theme: minimal
            selector: ""
            expected: minimal
          - case: zoot-runtime-override
            theme: minimal
            selector: zoot
            expected: zoot
          - case: invalid-selector-fallback
            theme: minimal
            selector: ../foo
            expected: minimal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and boot ${{ matrix.case }}
        env:
          PLMF_TEST_THEME: ${{ matrix.theme }}
          PLMF_TEST_SELECTOR: ${{ matrix.selector }}
          PLMF_EXPECT_THEME: ${{ matrix.expected }}
        run: |
          set -euo pipefail

          vm_path=$(nix build \
            --accept-flake-config \
            --impure \
            --no-link \
            --print-out-paths \
            --print-build-logs \
            -f ./tests/boot-splash-vm.nix)

          runner=$(find "$vm_path/bin" -maxdepth 1 \( -type f -o -type l \) -name 'run-*-vm' -print -quit)
          test -n "$runner"
          test -x "$runner"

          export TMPDIR="$RUNNER_TEMP/plmf-${{ matrix.case }}"
          export USE_TMPDIR=1
          export NIX_DISK_IMAGE="$TMPDIR/disk.qcow2"
          export NIX_EFI_VARS="$TMPDIR/efi-vars.fd"
          rm -rf "$TMPDIR"
          mkdir -p "$TMPDIR"

          serial_log="$TMPDIR/serial.log"
          runner_log="$TMPDIR/runner.log"
          marker="$TMPDIR/xchg/plmf-ready"
          export QEMU_OPTS="-display none -serial file:$serial_log -monitor none"

          timeout --signal=TERM 120s "$runner" >"$runner_log" 2>&1 &
          vm_pid=$!

          cleanup() {
            kill "$vm_pid" >/dev/null 2>&1 || true
            wait "$vm_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          passed=0
          for _ in $(seq 1 120); do
            if [ -s "$marker" ]; then
              passed=1
              break
            fi
            if ! kill -0 "$vm_pid" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if [ "$passed" -ne 1 ]; then
            echo 'PLMF VM smoke test did not reach the Noctalia readiness marker.' >&2
            echo '--- runner log ---' >&2
            cat "$runner_log" >&2 || true
            echo '--- serial log ---' >&2
            cat "$serial_log" >&2 || true
            exit 1
          fi

          cat "$marker"
          grep -Fxq "expected=$PLMF_EXPECT_THEME" "$marker"
          grep -Fxq "actual=$PLMF_EXPECT_THEME" "$marker"
          grep -Fxq 'plymouth=active' "$marker"
          grep -Fxq 'greetd=active' "$marker"
          grep -Fxq 'noctalia=active' "$marker"
