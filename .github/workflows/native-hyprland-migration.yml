name: Native Hyprland migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch Hyprland to Nixpkgs
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "flake.nix",
              '''    hyprland = {
                url = "github:hyprwm/Hyprland";
                inputs.nixpkgs.follows = "nixpkgs";
              };

          '''.replace("              ", ""),
              "",
          )

          Path("modules/nixos/hyprland.nix").write_text('''{ ... }:

          {
            programs.hyprland.enable = true;
          }
          '''.replace("          ", ""))

          Path("modules/home/hyprland.nix").write_text('''{ ... }:

          {
            wayland.windowManager.hyprland = {
              enable = true;
              package = null;
              portalPackage = null;
              configType = "hyprlang";
              systemd.enable = true;

              settings = {
                "$mod" = "SUPER";

                monitor = [
                  ",preferred,auto,1"
                ];

                input = {
                  kb_layout = "de";
                  follow_mouse = 1;
                };

                bind = [
                  "$mod, Return, exec, ghostty"
                  "$mod, D, exec, fuzzel"
                  "$mod SHIFT, Q, killactive"
                  "$mod SHIFT, E, exit"
                  "$mod, F, fullscreen"
                ];
              };
            };
          }
          '''.replace("          ", ""))

          replace(
              "scripts/nix-refresh.sh",
              "nix-refresh desktop      Home Manager, Mango, Noctalia, Greeter, Hyprland, and Caelestia",
              "nix-refresh desktop      Home Manager, Mango, Noctalia, Greeter, and Caelestia",
          )
          replace(
              "scripts/nix-refresh.sh",
              "INPUTS=(nixpkgs home-manager nix-cachyos-kernel mango noctalia noctalia-greeter hyprland caelestia-shell)",
              "INPUTS=(nixpkgs home-manager nix-cachyos-kernel mango noctalia noctalia-greeter caelestia-shell)",
          )
          replace(
              "scripts/nix-refresh.sh",
              "INPUTS=(home-manager mango noctalia noctalia-greeter hyprland caelestia-shell)",
              "INPUTS=(home-manager mango noctalia noctalia-greeter caelestia-shell)",
          )

          replace(
              "scripts/nix-updates.sh",
              "all) INPUTS=(nixpkgs home-manager nix-cachyos-kernel mango noctalia noctalia-greeter hyprland caelestia-shell); CHECK_PROFILE=1 ;;",
              "all) INPUTS=(nixpkgs home-manager nix-cachyos-kernel mango noctalia noctalia-greeter caelestia-shell); CHECK_PROFILE=1 ;;",
          )
          replace(
              "scripts/nix-updates.sh",
              "desktop) INPUTS=(home-manager mango noctalia noctalia-greeter hyprland caelestia-shell); CHECK_PROFILE=0 ;;",
              "desktop) INPUTS=(home-manager mango noctalia noctalia-greeter caelestia-shell); CHECK_PROFILE=0 ;;",
          )

          replace(
              "scripts/nix-help.sh",
              "nix-updates desktop        Preview Home Manager and all desktop/shell inputs",
              "nix-updates desktop        Preview Home Manager, Mango, Noctalia, Greeter, and Caelestia",
          )
          replace(
              "scripts/nix-help.sh",
              "nix-refresh desktop        Update Home Manager and all desktop/shell inputs",
              "nix-refresh desktop        Update Home Manager, Mango, Noctalia, Greeter, and Caelestia",
          )

          replace(
              "README.md",
              "`nix-refresh desktop` now updates Home Manager, Mango, Noctalia, Noctalia Greeter, Hyprland, and Caelestia Shell. It does not update Nixpkgs, the CachyOS kernel, or personal profile packages.",
              "`nix-refresh desktop` updates Home Manager, Mango, Noctalia, Noctalia Greeter, and Caelestia Shell. Hyprland comes from Nixpkgs and is therefore updated by `nix-refresh`, `nix-refresh base`, or `nix-refresh packages`. The desktop mode does not update Nixpkgs, the CachyOS kernel, or personal profile packages.",
          )
          marker = "## Caelestia Shell\n"
          readme = Path("README.md")
          text = readme.read_text()
          native = '''## Hyprland\n\nHyprland uses the native NixOS and Home Manager modules from the pinned Nixpkgs/Home Manager inputs. There is no separate Hyprland Flake input. The NixOS module installs Hyprland and its portal; Home Manager only writes the user configuration.\n\n'''
          if native not in text:
              text = text.replace(marker, native + marker)
              readme.write_text(text)

          replace(
              "UPDATES.md",
              "home-manager\nmango\nnoctalia\nnoctalia-greeter\nhyprland\ncaelestia-shell",
              "home-manager\nmango\nnoctalia\nnoctalia-greeter\ncaelestia-shell",
          )
          replace(
              "UPDATES.md",
              "home-manager\nmango\nnoctalia\nnoctalia-greeter\nhyprland\ncaelestia-shell",
              "home-manager\nmango\nnoctalia\nnoctalia-greeter\ncaelestia-shell",
          )
          replace(
              "UPDATES.md",
              "The `all` and `desktop` preview modes include both Hyprland and Caelestia Shell even when the currently active profile does not use them. This keeps every declared desktop source visible and updateable.",
              "Hyprland is supplied by Nixpkgs rather than a separate Flake input, so Hyprland changes are previewed through Nixpkgs in `all`, `base`, and `packages` modes. The `desktop` mode continues to preview Caelestia Shell and the other dedicated desktop inputs.",
          )
          updates = Path("UPDATES.md")
          text = updates.read_text()
          anchor = "Caelestia Shell is integrated through the normal Flake input:\n"
          note = "Hyprland is provided directly by the pinned Nixpkgs input through `programs.hyprland.enable`; it has no dedicated Flake input.\n\n"
          if note not in text:
              text = text.replace(anchor, note + anchor)
              updates.write_text(text)

          Path("FEATURE-TEST.md").unlink(missing_ok=True)

          Path(".github/workflows/desktop-feature-check.yml").write_text('''name: Desktop profile check

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - uses: cachix/install-nix-action@v31
                  with:
                    github_access_token: ${{ secrets.GITHUB_TOKEN }}

                - name: Validate shell scripts
                  run: |
                    bash -n scripts/install.sh
                    bash -n scripts/update.sh
                    bash -n scripts/nix-help.sh
                    bash -n scripts/nix-status.sh
                    bash -n scripts/nix-updates.sh
                    bash -n scripts/nix-refresh.sh

                - name: Verify locked desktop inputs
                  run: |
                    test "$(jq -r '.nodes.root.inputs.hyprland // empty' flake.lock)" = ""
                    jq -e '.nodes.root.inputs["caelestia-shell"]' flake.lock >/dev/null
                    nix flake metadata --no-write-lock-file >/dev/null

                - name: Evaluate all host profiles
                  run: |
                    profiles=(
                      nyx nyx-mango nyx-niri nyx-hyprland nyx-hyprland-caelestia
                      nyx-mango-niri nyx-mango-hyprland nyx-niri-hyprland nyx-all
                      aether aether-mango aether-niri aether-hyprland aether-hyprland-caelestia
                      aether-mango-niri aether-mango-hyprland aether-niri-hyprland aether-all
                    )
                    for profile in "${profiles[@]}"; do
                      echo "Evaluating $profile"
                      nix eval --no-write-lock-file --raw ".#nixosConfigurations.${profile}.config.networking.hostName" >/dev/null
                    done

                - name: Verify native Hyprland selection
                  run: |
                    test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.hyprland.enable)" = true
                    test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.noctalia.systemd.enable)" = false
                    test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-mango-hyprland.config.programs.mango.enable)" = true
                    test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-mango-hyprland.config.programs.hyprland.enable)" = true
                    test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland-caelestia.config.home-manager.users.xxxxx.programs.caelestia.enable)" = true
          '''.replace("          ", ""))
          PY

      - name: Rebuild lock file
        run: nix flake lock

      - name: Validate migration
        run: |
          git diff --check
          bash -n scripts/install.sh
          bash -n scripts/update.sh
          bash -n scripts/nix-help.sh
          bash -n scripts/nix-status.sh
          bash -n scripts/nix-updates.sh
          bash -n scripts/nix-refresh.sh
          test "$(jq -r '.nodes.root.inputs.hyprland // empty' flake.lock)" = ""
          jq -e '.nodes.root.inputs["caelestia-shell"]' flake.lock >/dev/null
          nix flake metadata --no-write-lock-file >/dev/null
          profiles=(
            nyx nyx-mango nyx-niri nyx-hyprland nyx-hyprland-caelestia
            nyx-mango-niri nyx-mango-hyprland nyx-niri-hyprland nyx-all
            aether aether-mango aether-niri aether-hyprland aether-hyprland-caelestia
            aether-mango-niri aether-mango-hyprland aether-niri-hyprland aether-all
          )
          for profile in "${profiles[@]}"; do
            echo "Evaluating $profile"
            nix eval --no-write-lock-file --raw ".#nixosConfigurations.${profile}.config.networking.hostName" >/dev/null
          done
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.hyprland.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.noctalia.systemd.enable)" = false

      - name: Commit migration
        run: |
          rm .github/workflows/native-hyprland-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(hyprland): use native Nixpkgs module"
          git push origin HEAD:main
