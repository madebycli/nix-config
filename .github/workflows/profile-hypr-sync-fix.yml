name: Apply profile persistence and Hyprland sync fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fixes
        run: python3 scripts/.profile-hypr-sync-migration.py

      - name: Validate scripts
        run: |
          git diff --check
          bash -n scripts/update.sh
          bash -n scripts/nix-refresh.sh
          bash -n scripts/nix-updates.sh
          bash -n scripts/nix-status.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile scripts/config-sync.py
          grep -Fx '.config/hypr' sync/paths.conf
          test -f config/home/.config/hypr/hyprland.conf
          grep -q '^    gh$' modules/nixos/desktop.nix

      - name: Evaluate all profiles
        run: |
          profiles=(
            nyx nyx-mango nyx-niri nyx-hyprland nyx-hyprland-caelestia
            nyx-mango-niri nyx-mango-hyprland nyx-niri-hyprland nyx-all
            aether aether-mango aether-niri aether-hyprland aether-hyprland-caelestia
            aether-mango-niri aether-mango-hyprland aether-niri-hyprland aether-all
          )
          for profile in "${profiles[@]}"; do
            echo "Evaluating $profile"
            nix eval --no-write-lock-file --raw ".#nixosConfigurations.${profile}.config.networking.hostName" >/dev/null
          done

          test "$(nix eval --no-write-lock-file --raw '.#nixosConfigurations.nyx.config.environment.etc."nixos-config/profile".text')" = "nyx"
          test "$(nix eval --no-write-lock-file --raw '.#nixosConfigurations.nyx-mango-hyprland.config.environment.etc."nixos-config/profile".text')" = "nyx-mango-hyprland"
          test "$(nix eval --no-write-lock-file --raw '.#nixosConfigurations.nyx-hyprland-caelestia.config.environment.etc."nixos-config/profile".text')" = "nyx-hyprland-caelestia"
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-mango-hyprland.config.programs.noctalia.systemd.enable)" = false

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix modules/home/hyprland.nix modules/nixos/desktop.nix sync/paths.conf config/home/.config/hypr/hyprland.conf scripts/update.sh scripts/nix-refresh.sh scripts/nix-updates.sh scripts/nix-status.sh scripts/config-sync.py
          git commit -m "fix: persist desktop profile and sync Hyprland config"
          git push origin HEAD:main
