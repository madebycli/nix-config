name: Desktop profile check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update.sh
          bash -n scripts/nix-help.sh
          bash -n scripts/nix-status.sh
          bash -n scripts/nix-updates.sh
          bash -n scripts/nix-refresh.sh

      - name: Validate config sync integration
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile scripts/config-sync.py
          grep -Fx '.config/hypr' sync/paths.conf
          test ! -e modules/home/hyprland.nix
          test ! -e config/home/.config/hypr/hyprland.conf
          grep -q 'coreutils diffutils findutils gh git' flake.nix
          grep -q 'gh auth login --hostname github.com --git-protocol https --web' scripts/nix-refresh.sh
          grep -q '"gh", "auth", "login"' scripts/config-sync.py

      - name: Verify locked desktop inputs
        run: |
          test "$(jq -r '.nodes.root.inputs.hyprland // empty' flake.lock)" = ""
          jq -e '.nodes.root.inputs["caelestia-shell"]' flake.lock >/dev/null
          nix flake metadata --no-write-lock-file >/dev/null

      - name: Evaluate all host profiles
        run: |
          profiles=(
            nyx nyx-mango nyx-niri nyx-hyprland nyx-hyprland-caelestia
            nyx-mango-niri nyx-mango-hyprland nyx-niri-hyprland nyx-all
            aether aether-mango aether-niri aether-hyprland aether-hyprland-caelestia
            aether-mango-niri aether-mango-hyprland aether-niri-hyprland aether-all
          )
          for profile in "${profiles[@]}"; do
            echo "Evaluating $profile"
            nix eval --no-write-lock-file --raw ".#nixosConfigurations.${profile}.config.networking.hostName" >/dev/null
          done

      - name: Verify desktop selections
        run: |
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx.config.programs.mango.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx.config.programs.niri.enable)" = false
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.hyprland.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland.config.programs.noctalia.systemd.enable)" = false
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-mango-hyprland.config.programs.mango.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-mango-hyprland.config.programs.hyprland.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-hyprland-caelestia.config.home-manager.users.xxxxx.programs.caelestia.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-all.config.programs.mango.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-all.config.programs.niri.enable)" = true
          test "$(nix eval --no-write-lock-file --json .#nixosConfigurations.nyx-all.config.programs.hyprland.enable)" = true
