name: Apply live feedback fixes v2

on:
  push:
    branches: [feat/github-cli-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/github-cli-sync
          fetch-depth: 0
      - name: Reuse guarded backend patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-live-feedback.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          block = source.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          patch = '\n'.join(lines) + '\n'

          call_start = 'replace_once(\n    "scripts/config-sync-wrapper.sh",'
          first = patch.find(call_start)
          if first < 0:
              raise SystemExit('wrapper patch call not found')
          next_call = patch.find('\n\nreplace_once(', first + len(call_start))
          if next_call < 0:
              raise SystemExit('next patch call not found')
          custom = '''wrapper = Path("scripts/config-sync-wrapper.sh")\nwrapper_text = wrapper.read_text(encoding="utf-8")\nwrapper_old = 'exec python3 "$SYNC_BACKEND" "${ARGS[@]}"\\n'\nwrapper_new = 'export NIX_CONFIG_GITHUB_AUTH_BACKEND="$AUTH_BACKEND"\\n' + wrapper_old\nwrapper_pos = wrapper_text.rfind(wrapper_old)\nif wrapper_pos < 0:\n    raise SystemExit("final config-sync backend exec not found")\nwrapper.write_text(\n    wrapper_text[:wrapper_pos] + wrapper_new + wrapper_text[wrapper_pos + len(wrapper_old):],\n    encoding="utf-8",\n)\n'''
          patch = patch[:first] + custom + patch[next_call + 2:]
          Path('/tmp/apply-live-backend.py').write_text(patch, encoding='utf-8')
          PY
          python3 /tmp/apply-live-backend.py
      - name: Validate patched backend
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/config-sync-wrapper.sh
          python3 -m py_compile scripts/config-sync.py scripts/config-sync-json.py scripts/github-cli-auth.py
          python3 -m unittest discover -s tests -v
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/config-sync.py scripts/config-sync-wrapper.sh tests/test_github_cli_sync.py
          git commit -m 'fix(sync): make packaged JSON status self-contained'
          git push origin HEAD:feat/github-cli-sync
