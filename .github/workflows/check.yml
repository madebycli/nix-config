name: Check

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lock file is consistent
        run: nix flake metadata --no-write-lock-file >/dev/null

      - name: Evaluate every host, with and without optional features
        run: |
          for cfg in ci-nyx ci-aether ci-nyx-full ci-aether-full; do
            echo "Evaluating $cfg"
            nix eval --no-write-lock-file --raw ".#nixosConfigurations.${cfg}.config.system.build.toplevel.drvPath" >/dev/null
          done

      - name: Keyring, Mango-only and official cache defaults
        run: |
          for host in ci-nyx ci-aether; do
            test "$(nix eval --no-write-lock-file --json ".#nixosConfigurations.${host}.config.services.gnome.gnome-keyring.enable")" = true
            test "$(nix eval --no-write-lock-file --json ".#nixosConfigurations.${host}.config.security.pam.services.greetd.enableGnomeKeyring")" = true
            test "$(nix eval --no-write-lock-file --json ".#nixosConfigurations.${host}.config.services.gnome.gcr-ssh-agent.enable")" = true
            test "$(nix eval --no-write-lock-file --json ".#nixosConfigurations.${host}.config.my.desktop.compositors")" = '["mango"]'
            nix eval --no-write-lock-file --json ".#nixosConfigurations.${host}.config.nix.settings" \
              | jq -e '.substitute != false and .substituters == ["https://cache.nixos.org/"] and .fallback != true and .["require-sigs"] != false' >/dev/null
          done

      - name: Both hosts select the standard Nixpkgs kernel
        run: |
          for host in ci-nyx ci-aether; do
            test "$(nix eval --no-write-lock-file --raw ".#nixosConfigurations.${host}.config.my.kernel")" = latest
            selected=$(nix eval --no-write-lock-file --raw ".#nixosConfigurations.${host}.config.boot.kernelPackages.kernel.drvPath")
            standard=$(nix eval --no-write-lock-file --raw ".#nixosConfigurations.${host}.pkgs.linuxPackages_latest.kernel.drvPath")
            test "$selected" = "$standard"
          done

      - name: Upstream Noctalia shell, Nixpkgs greeter and no extra cache
        run: |
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = "x86_64-linux";
              shell = flake.inputs.noctalia.packages.${system}.default;
              valid = host:
                let cfg = flake.nixosConfigurations.${host}; in
                cfg.config.programs.noctalia.package.drvPath == shell.drvPath
                && cfg.config.services.displayManager.noctalia-greeter.package.drvPath == cfg.pkgs.noctalia-greeter.drvPath
                && cfg.config.nix.settings.substituters == [ "https://cache.nixos.org/" ];
            in builtins.all valid [ "ci-nyx" "ci-aether" ]
          ' | jq -e '. == true'

      - name: Build the command-line tools (includes shellcheck)
        run: |
          nix build --no-write-lock-file --no-link \
            .#nx .#gbox .#dots .#nixctl .#agentbox .#install .#nix-settings .#nixdatifier-noctalia

      - name: Rust frontend JSON and real terminal startup
        run: NIX_SETTINGS_BINARY="$(nix build --no-write-lock-file --no-link --print-out-paths .#nix-settings)/bin/nix-settings-tui" python3 tests/nix_settings_test.py

      - name: Dev shells evaluate
        run: |
          for shell in default ai-cpu ai-rocm ai-cuda; do
            nix eval --no-write-lock-file --raw ".#devShells.x86_64-linux.${shell}.drvPath" >/dev/null
          done

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: nx unit tests
        run: python3 tests/nx_test.py

      - name: nixctl settings and failed-build guards
        run: python3 tests/nixctl_test.py

      - name: Real Nix lock-reconciliation CLI
        run: python3 tests/nx_nix_cli_test.py

      - name: Installer lock refresh and rollback
        run: python3 tests/install_test.py

      - name: plmf CLI
        run: bash tests/plmf-cli-test.sh

      - name: dots two-machine sync
        run: DOTS="$(nix build --no-write-lock-file --no-link --print-out-paths .#dots)/bin/dots" bash tests/dots-test.sh

      - name: gbox isolation (needs unprivileged user namespaces)
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          GBOX="$(nix build --no-write-lock-file --no-link --print-out-paths .#gbox)/bin/gbox" bash tests/gbox-test.sh

      - name: Secret scan
        run: nix run --no-write-lock-file nixpkgs#gitleaks -- git . --redact --no-banner

  gaming-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Nixpkgs as the installer does
        run: nix flake update nixpkgs

      - name: Build the affected Python dependency chain and Lutris
        run: |
          nix build --no-write-lock-file --no-link --print-build-logs \
            .#nixosConfigurations.ci-nyx.pkgs.python3Packages.pyrate-limiter \
            .#nixosConfigurations.ci-nyx.pkgs.python3Packages.moddb \
            .#nixosConfigurations.ci-nyx.pkgs.lutris
